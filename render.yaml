# Render Blueprint – БЕЗПЛАТЕН вариант: една уеб услуга (API + клиент + симулацията в същия процес).
# Базата е външна и безплатна (Aiven Free PostgreSQL – не изтича): при създаването Render пита за DATABASE_URL.
# Разполагане: Render -> New -> Blueprint -> това хранилище. Подробно: docs/deployment/README.md.
services:
  - type: web
    name: urbanica
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # адресът на базата (Aiven Free PostgreSQL – Service URI, с ?sslmode=require) – въвежда се в Render, не в Git.
      # Броят връзки (connection_limit=10) се добавя автоматично. По желание: DATABASE_URL_UNPOOLED – отделен
      # адрес само за миграциите (нужен при база с пул на връзките, напр. Neon).
      - key: DATABASE_URL
        sync: false
      - key: WORLD_SEED
        value: gce-alpha-1
      # един игрови ден = 1 секунда
      - key: GAME_DAY_MS
        value: '1000'
      # симулацията върви в уеб услугата (безплатният план няма фонов worker)
      - key: EMBEDDED_WORKER
        value: 'true'
      - key: DEV_EXPOSE_RESET_TOKEN
        value: 'false'
