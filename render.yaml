# Render Blueprint – БЕЗПЛАТЕН вариант: една уеб услуга (API + клиент + симулацията в същия процес)
# и безплатна PostgreSQL база. Разполагане: Render -> New -> Blueprint -> това хранилище.
# Платеният вариант (отделен worker, винаги онлайн) е описан в docs/deployment/README.md.
databases:
  - name: urbanica-db
    plan: free
    postgresMajorVersion: '17'
    databaseName: gce
    user: gce

services:
  - type: web
    name: urbanica
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: urbanica-db
          property: connectionString
      - key: WORLD_SEED
        value: gce-alpha-1
      - key: TICK_INTERVAL_MS
        value: '20000'
      # симулацията върви в уеб услугата (безплатният план няма фонов worker)
      - key: EMBEDDED_WORKER
        value: 'true'
      - key: DEV_EXPOSE_RESET_TOKEN
        value: 'false'
